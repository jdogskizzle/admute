# admute: mutes ads on live TV, as an M3U tuner for Jellyfin, plus the studio dashboard.
# Everything specific to one machine lives in this file (and .env for the studio login): the
# tuner's playlist, the folders, the user, the Docker network and the GPU.
#
# Jellyfin: add an M3U tuner with URL http://admute:5004/lineup.m3u (Jellyfin must be on
# the same Docker network). See README.md for the studio, the replay tool and tuning settings.

# Detector settings. Live TV, the studio's surveys and ./replay all use these, so a survey
# sounds like live would.
x-detector: &detector
  DELAY: 6                # seconds viewers are behind live (lookahead for the detector)
  AD_MIN: 3               # seconds without the logo before muting; keep about 3s under DELAY
  DETECT_GPU: 1           # 0 to decode on the CPU (and drop the deploy sections below)
  NVIDIA_DRIVER_CAPABILITIES: compute,video,utility

x-common: &common
  image: admute:local
  build:
    context: .
    additional_contexts:
      formlogin: ${FORMLOGIN_SRC:-https://github.com/jdogskizzle/formlogin.git#v1.0.0}   # sign-in library; FORMLOGIN_SRC=<folder> to build from a local copy
  restart: unless-stopped
  user: "1000:1000"         # owner of the files written to ./data and the review folder
  volumes:
    - ./app:/app:ro
    - ./data:/data                              # learned logos, logs, replay results (not in git)
    - /mnt/media/dvr:/recordings:ro             # recordings for the studio and ./replay
    - /mnt/media/admute-review:/review          # rendered clips go here
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu, video, compute, utility]
  networks:
    - apps                  # the network Jellyfin and Caddy are on

services:
  admute:
    <<: *common
    container_name: admute
    environment:
      <<: *detector
      SOURCE_M3U: http://dvr-guard:8000/lineup.m3u   # channel playlist: dvr-guard shares the tuner (or the tuner's own, e.g. http://<hdhomerun>/lineup.m3u)
      CHANNELS: "4.1"         # comma list like 4.1,5.1, "group:<group-title>" or "all"
      LINGER: 15              # keep a channel open this long after the last viewer leaves
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:5004/status', timeout=5)"]
      interval: 60s

  # Dashboard: recordings, surveys, timeline + video, labels, tuning, live status.
  # Reached through Caddy at /admute/ (no host port). Login in .env (see .env.example).
  studio:
    <<: *common
    container_name: admute-studio
    entrypoint: ["python3", "-u", "/app/studio.py"]
    environment:
      <<: *detector
      LIVE_URL: http://admute:5004            # the proxy above, for the Live tab
      STUDIO_USERNAME: ${STUDIO_USERNAME:-}
      STUDIO_PASSWORD_HASH: ${STUDIO_PASSWORD_HASH:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/login', timeout=5)"]
      interval: 60s

networks:
  apps:
    external: true
